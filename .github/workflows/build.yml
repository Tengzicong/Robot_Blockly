# ============================================================================
# Robot Blockly  GitHub Actions 多平台自动构建
#
# 触发:
#   - 推送 tag  v*  (如 v0.1.0)  -> 构建全部平台
#   - workflow_dispatch (手动触发)
#
# 产物 (Artifacts):
#   linux-x64-deb    blockly_unitree/dist/blockly-unitree_*.deb
#   linux-arm64-deb  blockly_unitree/dist/blockly-unitree_*.deb + wheels/*.whl
#   windows-x64      blockly_unitree/dist/RobotBlockly/  (单目录 + exe)
#   macos-arm64      blockly_unitree/dist/RobotBlockly-*.dmg
#   macos-x86_64     blockly_unitree/dist/RobotBlockly-*.dmg
# ============================================================================
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # --------------------------- Linux x86_64 deb ---------------------------
  linux-x64:
    name: Linux x64 (deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deb
        run: |
          cd blockly_unitree
          bash packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: blockly_unitree/dist/blockly-unitree_*.deb

  # ------------------------- Linux aarch64 deb ----------------------------
  # x64 主机用 docker+buildx+qemu 模拟 arm64, 编译 cyclonedds 0.10.2 wheel 并出 deb
  linux-arm64:
    name: Linux arm64 (deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build arm64 deb + wheel
        run: |
          cd blockly_unitree
          bash packaging/build_linux_arm64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: |
            blockly_unitree/dist/blockly-unitree_*.deb
            blockly_unitree/wheels/*.whl

  # ---------------------------- Windows x64 -------------------------------
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # 与 unitree conda 环境一致, 保证 cyclonedds 0.10.2 wheel 可用
      - name: Build
        shell: pwsh
        run: |
          cd blockly_unitree
          powershell -ExecutionPolicy Bypass -File packaging/build_win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: blockly_unitree/dist/RobotBlockly/

  # --------------------------- macOS (dual-arch) --------------------------
  # arm64 机跑出 _arm64.dmg; x86_64 机跑出 _x86_64.dmg
  # 注: macos-13 (Intel) 已于 2025-12-04 下线, Intel 构建须用 macos-15-intel
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            arch: arm64
          - os: macos-15-intel  # Intel x86_64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify runner architecture
        run: |
          echo "runner arch: $(uname -m)"
          [ "$(uname -m)" = "${{ matrix.arch }}" ] || {
            echo "::error::runner 架构与 matrix.arch 不符"; exit 1; }
      - name: Install icon + build toolchain
        run: brew install librsvg cmake || true
      - name: Build dmg
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          MIN_MACOS: "12.0"
        run: |
          cd blockly_unitree
          bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: blockly_unitree/dist/RobotBlockly-*.dmg
